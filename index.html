<html lang="en" data-theme="adire">
  <head>
    <meta charset="UTF-8" />

    <meta name="theme-color" content="#0d1130" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link rel="canonical" href="https://ahmadsubair.netlify.app/" />

    <!-- Link previews (WhatsApp, LinkedIn, X). Image URLs must be absolute. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ahmadsubair.netlify.app/" />
    <meta property="og:title" content="Ahmad Subair | Full-Stack Developer" />
    <meta property="og:description" content="Full-stack developer in Lagos building fast, reliable products for startups, businesses and teams in any industry." />
    <meta property="og:image" content="https://ahmadsubair.netlify.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Ahmad Subair, full-stack developer, next to an eight-point star emblem" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://ahmadsubair.netlify.app/og-image.png" />

    <!-- Structured data: tells search engines this page is about a person -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Ahmad Subair",
        "alternateName": "Abu Sumayyah",
        "jobTitle": "Full-Stack Developer",
        "url": "https://ahmadsubair.netlify.app/",
        "address": { "@type": "PostalAddress", "addressLocality": "Lagos", "addressCountry": "NG" },
        "sameAs": ["https://github.com/Abu-Sumayyah-05", "https://www.linkedin.com/in/ahmad-subair-03a997339/"]
      }
    </script>

    <!-- Fonts: Fraunces (headings), Hanken Grotesk (body), JetBrains Mono (labels).
         display=swap shows fallback text immediately on slow connections. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Loaded without blocking the first paint: fetched as a "preload", then switched to a stylesheet -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..500&family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..500&family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" /></noscript>

    <!-- Runs before anything paints:
         1. apply the visitor's saved palette so there's no flash of the wrong colours
         2. decide whether to play the intro (first visit this session, motion allowed) -->
    <script>
      (function () {
        var html = document.documentElement;
        var palette = 'adire';
        var skipIntro = false;
        try {
          var saved = localStorage.getItem('palette');
          if (saved === 'adire' || saved === 'clay' || saved === 'signal') palette = saved;
          skipIntro = sessionStorage.getItem('intro-seen') === '1';
        } catch (e) {}
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) skipIntro = true;
        // On slow connections or Data Saver, get straight to the content
        var conn = navigator.connection;
        if (conn && (conn.saveData || /2g|3g/.test(conn.effectiveType || ''))) skipIntro = true;
        html.dataset.theme = palette;
        html.dataset.intro = skipIntro ? 'skip' : 'play';
      })();
    </script>
  </head>
  <body>
    <!-- Intro loader lives in plain HTML so it shows while the JS bundle downloads.
         main.jsx adds .loaded to <html> when the app is ready, which lifts it away. -->
    <div class="loader" aria-hidden="true">
      <svg viewBox="0 0 100 100"><path d="M50 5 L61 39 L95 50 L61 61 L50 95 L39 61 L5 50 L39 39 Z M50 18 L72 28 L82 50 L72 72 L50 82 L28 72 L18 50 L28 28 Z" /></svg>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
